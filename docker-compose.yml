version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp_api
    restart: unless-stopped
    environment:
      PORT:               "8080"
      DATABASE_URL:       "postgres://postgres:root@host.docker.internal:5432/postgres?sslmode=disable"
      JWT_SECRET:         "change-me-in-production-use-32chars!!"
      JWT_EXPIRY_HOURS:   "8"
      JWT_REFRESH_HOURS:  "168"
      CORS_ORIGINS:       "*"
      APP_ENV:            production
      BCRYPT_COST:        "12"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3