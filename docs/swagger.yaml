  /finance/payments:
    get:
      description: |-
        status filters on approval: PENDING_APPROVAL (รออนุมัติ; PO PENDING_REAPPROVAL included) or
        APPROVED (อนุมัติแล้ว); empty returns both. Any other value -> 400. Each row also carries
        approval_status (the same two-value form). Recording a payment still requires APPROVED.
        Each row carries project_code and project_name (LEFT JOIN project; null when the
        document has no project or the code matches none).
        For doc_type=PO, a non-deleted document additionally requires at least one
        non-CANCELLED line with qty_received > 0 — partial receipt is sufficient. This
        does not apply to WO. Each PO row carries receiving_status: FULLY_RECEIVED,
        PARTIALLY_RECEIVED or NOT_RECEIVED (null for WO), computed live from
        purchase_order_line.qty_received vs qty_ordered, not from grn or status_receive.
      parameters:
      - description: PO, WO or PC
        in: query
        name: doc_type
        required: true
        type: string
      - description: filter project_code
        in: query
        name: project_code
        type: string
      - description: PENDING_APPROVAL | APPROVED (empty = both)
        in: query
        name: status
        type: string
      - description: search doc_no
        in: query
        name: search
        type: string
      - description: page
        in: query
        name: page
        type: integer
      - description: page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: List PO, WO or PC (petty cash) headers with paid/remaining amounts
      tags:
      - Finance
    post:
      consumes:
      - application/json
      description: |-
        New payments only (amount_paid > 0). Locks the document row, requires status APPROVED,
        rejects a fully-paid document and any amount above the remaining balance. Reversals
        are no longer accepted here (reverses_id -> 400); use POST /finance/payments/{id}/cancel.
        Optional installment_ids / installment_nos: marks those unpaid payment_installment rows of the
        same document paid (is_paid, paid_at, paid_by, payment_log_id = new id) in the same transaction.
        amount_paid is always the client-sent amount (> 0, <= remaining); it is NOT tied to the
        installments' amounts.
      parameters:
      - description: Payment data
        in: body
        name: body
        required: true
        schema:
