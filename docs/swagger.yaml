      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: List approval configs
      tags:
      - Approval Config
  /approval-config/{id}:
    delete:
      parameters:
      - description: ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: Delete approval config
      tags:
      - Approval Config
    patch:
      consumes:
      - application/json
      parameters:
      - description: ID
        in: path
        name: id
        required: true
        type: integer
      - description: is_active
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: Toggle approval config active status
      tags:
      - Approval Config
  /approval-config/batch:
    post:
      consumes:
      - application/json
      parameters:
      - description: create array and delete id array
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: Batch create/delete approval config steps
      tags:
      - Approval Config
  /approval-delegation:
    get:
      parameters:
      - description: Filter by doc type
        in: query
        name: doc_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: List extra approvers
      tags:
      - Approval Delegation
    post:
      consumes:
      - application/json
      parameters:
      - description: Extra approver payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.approvalDelegationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: Add an extra approver (additive, on top of role-based approvers)
      tags:
      - Approval Delegation
  /approval-delegation/{id}:
    delete:
      parameters:
      - description: Extra approver row ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: Remove an extra approver
      tags:
      - Approval Delegation
  /approval-doc-types:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: List approval document types
      tags:
      - Approval Doc Types
    post:
      consumes:
      - application/json
      parameters:
      - description: doc_type, doc_label, is_active
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: Create approval document type
      tags:
      - Approval Doc Types
  /approval-doc-types/{id}:
    patch:
      consumes:
      - application/json
      parameters:
      - description: ID
        in: path
        name: id
        required: true
        type: integer
      - description: is_active
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: Toggle approval document type active status
      tags:
      - Approval Doc Types
  /approval-request/{docType}/{docId}/my-status:
    get:
      description: |-
        Backs Approve/Reject button gating on the frontend. Eligibility = role-based approver
        (approval_config + user_roles) OR extra approver (approval_delegation), for the doc's
        current PENDING approval_request row.
      parameters:
      - description: Document type, e.g. MEMO, BORROW, or PO
        in: path
        name: docType
        required: true
        type: string
      - description: Document ID
        in: path
        name: docId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Check whether the current user is an eligible approver for a document's
        current step
      tags:
      - Approvals
  /approval/{docType}/{docId}/approve:
    put:
      consumes:
      - application/json
      parameters:
      - description: Document type, e.g. PO or MEMO
        in: path
        name: docType
        required: true
        type: string
      - description: Document ID
        in: path
        name: docId
        required: true
        type: integer
      - description: Optional comments
        in: body
        name: body
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Approve a document (generic, config-driven)
      tags:
      - Approvals
  /approval/{docType}/{docId}/reject:
    put:
      consumes:
      - application/json
      parameters:
      - description: Document type, e.g. PO or MEMO
        in: path
        name: docType
        required: true
        type: string
      - description: Document ID
        in: path
        name: docId
        required: true
        type: integer
      - description: Optional comments
        in: body
        name: body
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Reject a document (generic, config-driven)
      tags:
      - Approvals
  /approval/PETTY_CASH/{id}/approve:
    put:
      consumes:
      - application/json
      description: 'One transaction: approval_request, document status, petty_cash_status_log,
        approval_log (APPROVE, with comments + ip). Caller must be the assigned approver
        (403 otherwise); an already decided document returns 409. Also reachable as
        PUT /approval/PETTY_CASH/{docId}/approve.'
      parameters:
      - description: Petty cash requisition ID
        in: path
        name: id
        required: true
        type: integer
      - description: Optional comments
        in: body
        name: body
        schema:
          $ref: '#/definitions/models.ApprovalActionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Approve a petty cash requisition (PENDING_APPROVAL → APPROVED)
      tags:
      - Petty Cash
  /approval/PETTY_CASH/{id}/reject:
    put:
      consumes:
      - application/json
      description: Same as approve, but comments are required (400). Also reachable
        as PUT /approval/PETTY_CASH/{docId}/reject.
      parameters:
      - description: Petty cash requisition ID
        in: path
        name: id
        required: true
        type: integer
      - description: comments required
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.ApprovalActionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Reject a petty cash requisition (PENDING_APPROVAL → REJECTED)
      tags:
      - Petty Cash
  /approvals/audit:
    get:
      parameters:
      - description: table name filter
        in: query
        name: table_name
        type: string
      - description: record ID
        in: query
        name: record_id
        type: integer
      - default: 1
        description: page
        in: query
        name: page
        type: integer
      - default: 20
        description: page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PaginatedResponse'
      security:
      - BearerAuth: []
      summary: Get general ERP audit log
      tags:
      - Approvals
  /approvals/logs:
    get:
      parameters:
      - description: PR|PO|GRN
        in: query
        name: doc_type
        required: true
        type: string
      - description: document ID
        in: query
        name: doc_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.ApprovalLog'
            type: array
      security:
      - BearerAuth: []
      summary: Get approval history for a document
      tags:
      - Approvals
  /approvals/my-pending-counts:
    get:
      description: 'Number of Memo / PO / WO / PR documents waiting for the caller:
        status PENDING_APPROVAL (Memo, PR) or PENDING_APPROVAL/PENDING_REAPPROVAL
        (PO, WO), assigned to the caller (approver_id; a NULL approver_id counts for
        nobody). Same filter as the approval lists.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Pending-approval counts for the current user (sidebar badges)
      tags:
      - Approvals
  /approvals/pending:
    get:
      parameters:
      - description: filter by doc_type (PR|PO|GRN)
        in: query
        name: doc_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.ApprovalRequest'
            type: array
      security:
      - BearerAuth: []
      summary: List pending approvals for current user
      tags:
      - Approvals
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Change the current user's password
      parameters:
      - description: Passwords
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate and receive JWT token pair
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokenPair'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: Login
      tags:
      - Auth
  /auth/me:
    get:
      description: Get the authenticated user's profile and roles
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Current user profile
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Get new access token using refresh token
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokenPair'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: Refresh token
      tags:
      - Auth
  /customer:
    get:
      description: Paginated list sorted by customer_code. q (alias search) matches
        customer_code, customer_name, contact, contact_phone, tel (case-insensitive).
        is_active defaults to true when omitted; pass is_active=false for inactive
        only or is_active=all for both.
      parameters:
      - description: Search customer_code/customer_name/contact/tel
        in: query
        name: q
        type: string
      - description: Alias of q
        in: query
        name: search
        type: string
      - description: true (default) | false | all
        in: query
        name: is_active
        type: string
      - description: Page
        in: query
        name: page
        type: integer
      - description: Page size (default 20, max 500; alias limit)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: รายการลูกค้า
      tags:
      - Customer
    post:
      consumes:
      - application/json
      description: customer_code (max 20, unique ignoring case/surrounding spaces)
        and customer_name (max 255) are required; tel max 50. Empty optional fields
        are stored as NULL.
      parameters:
      - description: Customer data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CreateCustomerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: สร้างลูกค้าใหม่
      tags:
      - Customer
  /customer/{id}:
    delete:
      description: Deletes the row only when nothing references it (every FK to customer
        is checked, today project.customer_id; inactive projects count too). Otherwise
        409 and the customer should be deactivated via PUT is_active=false instead.
        404 when the customer does not exist.
      parameters:
      - description: Customer ID (cus_id)
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: ลบลูกค้า (hard delete เมื่อยังไม่ถูกใช้งาน)
      tags:
      - Customer
    get:
      parameters:
      - description: Customer ID (cus_id)
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Customer'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: ข้อมูลลูกค้ารายตัว
      tags:
      - Customer
    put:
      consumes:
      - application/json
      description: Omitted fields keep their current value; an optional field sent
        as an empty string is cleared to NULL. updated_by/updated_at are set from
        the JWT / now().
      parameters:
      - description: Customer ID (cus_id)
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.UpdateCustomerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Customer'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: แก้ไขข้อมูลลูกค้า
      tags:
      - Customer
  /customer/import:
    post:
      consumes:
      - multipart/form-data
      description: 'Column layout (row 1 = header, data starts row 2): customer_code*,
        customer_name*, address, contact, credit_term, remarks, contact_phone (optional,
        max 50), tax_id (optional, 13 digits). Validates every row (required fields,
        customer_code uniqueness — case-sensitive exact match, credit_term against
        the fixed option list excluding เงินสด) and processes in partial-success mode:
        valid rows are inserted, invalid rows are skipped and reported. Re-upload
        only the failed rows after fixing them.'
      parameters:
      - description: Excel file (.xlsx)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Bulk import customers จาก Excel
      tags:
      - Customer
  /customer/import/template:
    get:
      description: 'Generates the .xlsx on the fly: sheet "Customer" with header row
        (customer_code*, customer_name*, address, contact, credit_term, remarks),
        one example row, and a notes row. A hidden "Lookup" sheet lists the fixed
        credit_term options (same hardcoded list as the Supplier page''s dropdown,
        excluding เงินสด for Customer), bound to the credit_term column as an Excel
        dropdown. No database query is involved for this list.'
      produces:
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        "200":
          description: OK
          schema:
            type: file
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: ดาวน์โหลด template Excel สำหรับ import ลูกค้า
      tags:
      - Customer
  /departments:
    get:
      description: All departments ordered by sort_order, dept_code. active_only=true
        returns only is_active rows (use it for dropdowns).
      parameters:
      - description: Only active departments
        in: query
        name: active_only
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: List departments
      tags:
      - Departments
    post:
      consumes:
      - application/json
      description: dept_code is trimmed, upper-cased, max 20, A-Z 0-9 and _ only,
        and cannot be changed later. dept_name required, max 200. sort_order integer
        >= 0 (default 0). is_active defaults to true. 409 when the code already exists.
      parameters:
      - description: Department
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.departmentCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Create a department
      tags:
      - Departments
  /departments/{id}:
    delete:
      description: Refused with 409 while any table with a dept_code column (users,
        roles, project, purchase_request, petty_cash_requisition, dept_menu_permissions,
        ...) still references the code; the message lists the tables and row counts
        and suggests deactivating instead. The check and the delete run in one transaction.
      parameters:
      - description: Department id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
