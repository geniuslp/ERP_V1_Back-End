  /grn:
    get:
      parameters:
      - description: PO ID filter
        in: query
        name: po_id
        type: integer
      - description: status filter
        in: query
        name: status
        type: string
      - default: 1
        description: page
        in: query
        name: page
        type: integer
      - default: 20
        description: page size
        in: query
        name: page_size
