  /pr/{id}/reopen:
    put:
      description: |-
        Allowed from COMPLETED, STOCK_CHECK, PARTIALLY_FILLED, FULFILLED. Blocks with 409 if any
        active PO (status != CANCELLED, incl. fully received) references this PR's lines via
        purchase_order_line.pr_line_id. The system does not auto-cancel anything. Reverses any stock
        deducted by deductStockOnSubmit (stock_transaction rows with ref_doc_type='PR',
        ref_doc_id=id, txn_type='OUT') by restoring stock_item.qty and recording an
        offsetting 'IN' transaction, then sets status back to DRAFT. For cost PRs it also
        reverses the project credit: per pr_line_id it nets the ref_type='PR' rows of
        ic_project_cost_item_transaction and, if the net is > 0, subtracts it from
        ic_project_cost_item.qty_on_hand (409 if the project no longer holds that much)
        and writes a negative 'PR' row. Idempotent: a net of 0 writes nothing. Nothing
        is deleted. project_stock is not involved.
      parameters:
      - description: PR ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
