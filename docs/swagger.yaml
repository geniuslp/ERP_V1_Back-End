        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
        "409":
          description: active PO linked to this PR, or stock already consumed
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Reopen a non-DRAFT PR back to DRAFT for editing
      tags:
      - Purchase Request
