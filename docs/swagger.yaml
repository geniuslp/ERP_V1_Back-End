      tags:
      - Master
    post:
      consumes:
      - application/json
      description: 'project_code is generated by the server as YYYY-{customer_code}-NNN
        (client value ignored; customer_id required) and cannot be changed afterwards.
        location_code is now a free-text project address (no longer validated/joined
        against the location master). dept_code ("แผนก") is validated against the
        departments master (400 on an unknown code). job_codes is a subset of MP/ME/MS/MF/MG/MH/G
        (validated server-side, 400 on any other value). project_owner_name is free
        text ("เจ้าของโครงการ") — legacy, kept for backward compat. customer_id (FK
        -> customer.cus_id) is the new dropdown-selected "เจ้าของโครงการ" going forward;
        both fields are accepted independently. responsible_person_name ("ผู้รับผิดชอบหลัก")
        is required free text, replacing the old owner_id dropdown — owner_id is still
        accepted for backward compatibility but no longer required or used to drive
        anything. consultant_phone ("เบอร์ติดต่อของที่ปรึกษา") is freeform, no validation.
        job_shares: a needs-share job may be sent without a percent (missing / null
        / "" / 0) — it stays in job_codes and no share row is written; the total is
        not capped by the app, but a total above 100 (or one share above 100) is rejected
        with a plain Thai 400 from the DB guards (trg_project_job_share_total / share_percent
        CHECK).'
      parameters:
      - description: Project data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CreateProjectReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.ProjectDetail'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Create project
      tags:
      - Master
  /master/projects/{id}:
    delete:
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Soft-delete project
      tags:
      - Master
    get:
      description: 'Detail also returns job_shares: [{job_code, share_percent, share_amount}]
        (share_amount = budget_amount * share_percent / 100, derived, read-only);
        [] for legacy projects with no rows. Also returns in_use / in_use_by (see
        List).'
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ProjectDetail'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Get project by id
      tags:
      - Master
    put:
      consumes:
      - application/json
      description: 'location_code is now a free-text project address (no longer validated/joined
        against the location master). dept_code ("แผนก") is validated against the
        departments master (400 on an unknown code). job_codes is a subset of MP/ME/MS/MF/MG/MH/G
        (validated server-side, 400 on any other value). project_owner_name is free
        text ("เจ้าของโครงการ") — legacy, kept for backward compat. customer_id (FK
        -> customer.cus_id) is the new dropdown-selected "เจ้าของโครงการ" going forward;
        both fields are accepted independently. responsible_person_name ("ผู้รับผิดชอบหลัก")
        is required free text, replacing the old owner_id dropdown — owner_id is still
        accepted for backward compatibility but no longer required or used to drive
        anything. consultant_phone ("เบอร์ติดต่อของที่ปรึกษา") is freeform, no validation.
        job_shares: a needs-share job may be sent without a percent (missing / null
        / "" / 0) — it stays in job_codes and no share row is written; the total is
        not capped by the app, but a total above 100 (or one share above 100) is rejected
        with a plain Thai 400 from the DB guards (trg_project_job_share_total / share_percent
        CHECK). OWNER CHANGE: customer_id, owner_id and project_owner_name are the
        owner fields; an omitted owner field keeps its current value, and a sent value
        that differs from the stored one is saved only while the project_code is NOT
        used by any work document — otherwise 409 "ไม่สามารถเปลี่ยนเจ้าของโครงการได้
        เนื่องจากรหัสโครงการนี้ถูกใช้งานแล้วใน: <list>" (the check runs inside the
        UPDATE transaction). Other fields are never blocked by usage. See in_use /
        in_use_by on GET. PROJECT CODE FOLLOWS THE CUSTOMER: when customer_id changes
        on an unused project, project_code is recomputed as {year}-{new customer_code}-{same
        NNN} (year and number kept, project_code_year_counter untouched); 409 "รหัสโครงการ
        <code> ซ้ำกับโครงการอื่น" if that code exists. A legacy code that does not
        match YYYY-*-N, or a customer without customer_code, keeps the code and still
        saves the owner. A project_code in the body is always ignored; the response
        returns the saved project_code.'
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.UpdateProjectReq'
      produces:
