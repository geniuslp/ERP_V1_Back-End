  /ic/pos/{poId}/receive-document:
    get:
      description: Returns read-only PO/supplier/project context plus this PO's current
        DRAFT receive document (receive_no IS NULL, newest such row), or null if there
        is no draft — i.e. every existing document for this PO already has a receive_no,
        or none exist yet. A PO can have many receive_document rows now (one per delivery/invoice
        round); use GET /ic/pos/{poId}/receive-documents to list all of them, or GET
        /ic/pos/{poId}/receive-documents/{docId} for one specific (already-finalized)
        document.
      parameters:
      - description: purchase_order.id
        in: path
        name: poId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Get PO receive document context + the current draft document (if any)
      tags:
      - IC
    post:
      consumes:
      - application/json
      description: tax_invoice_date (optional) must be YYYY-MM-DD and not later than
        today in Asia/Bangkok — a future date returns 400 (วันที่ใบกำกับภาษีต้องไม่เกินวันที่ปัจจุบัน)
        before anything is written or numbered; past dates and today are allowed.
        temp_delivery_date (optional; empty/missing stays valid and is stored NULL)
        must likewise be YYYY-MM-DD and not later than today, else 400 (วันที่ใบส่งของชั่วคราวต้องไม่เกินวันที่ปัจจุบัน);
        if both are invalid the tax invoice message is returned. Creates a NEW ic_po_receive_document
        row for this PO — a PO can have many receive documents now (one per delivery/invoice
        round). 409s "this PO has nothing left to receive" when SUM(qty_ordered -
        qty_received) over the PO's lines is <= 0. 409s "an empty receive document
        already exists" if this PO already has an empty draft document (receive_no
        IS NULL) so empty drafts can't stack; that draft must be submitted (via receive-lines/submit)
        or deleted first. Computes due_date = (business date this row is created,
        Asia/Bangkok) + credit_days (credit_days parsed from the PO's supplier payment_terms).
        due_date is NULL if credit_days can't be parsed. Computed once at creation
        and never recomputed on later partial-receive rounds.
      parameters:
      - description: purchase_order.id
        in: path
        name: poId
        required: true
        type: integer
      - description: Receive document
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.ICSubmitReceiveDocumentSwagger'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Submit the PO receive document
      tags:
      - IC
  /ic/pos/{poId}/receive-documents:
    get:
      description: 'data.documents: newest first (created_at DESC). line_count = COUNT
        of ic_project_cost_item_transaction rows PLUS stock_transaction rows linked
        to that document via receive_document_id — both tables now carry that FK,
        so this is accurate for order_type=''cost'' AND order_type=''stock'' POs (stock_transaction
        rows written before this FK existed, or for a PO that historically had more
        than one document, may still be unlinked — those don''t count here). deletable
        = (receive_no IS NULL AND line_count = 0). data.remaining_qty_total = SUM(qty_ordered
        - qty_received) over the PO''s lines. data.can_create_new = purchase_order.status
        = ''APPROVED'' AND remaining_qty_total > 0 AND no document for this PO has
        receive_no IS NULL — mirrors exactly the checks POST /ic/pos/{poId}/receive-document
        enforces.'
      parameters:
      - description: purchase_order.id
        in: path
        name: poId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
