        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: List cost-subgroup codes for a project, across all of its job_codes
      tags:
      - IC Project Movement
  /ic/projects/{projectCode}/cost-transactions:
