      - description: Work Order data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CreateWorkOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: สร้างหนังสือสั่งจ้าง (DRAFT)
      tags:
      - WorkOrder
  /work-order/{id}:
    get:
      parameters:
      - description: Work Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: รายละเอียดหนังสือสั่งจ้าง
      tags:
      - WorkOrder
    put:
      consumes:
      - application/json
      description: |-
        Accepts the same body shape as Create (models.CreateWorkOrderRequest) — lines are
        always replaced together with the header in this single call, mirroring
        POHandler.Update's all-in-one PUT rather than requiring a separate lines call.
        The dedicated PUT /work-order/{id}/lines endpoint remains available for a
        lines-only edit that doesn't touch header fields. Only allowed while
        status = DRAFT — mirrors PO's Update rule exactly (PO also rejects everything
        else, including REJECTED, and points APPROVED callers at its edit-approved
        endpoint instead; WO has no such endpoint yet, so APPROVED/other statuses just 400).
        The payload's own `status` field ("บันทึกร่าง" sends DRAFT, "ส่งอนุมัติ" sends
        PENDING_APPROVAL) is written to the row and, when it actually changes, logged to
        work_order_status_log — a transition to PENDING_APPROVAL also opens the step-1
        approval_request exactly like POST /:id/submit does, since this is an alternate
        entry point into the same submit flow. Any other status value is rejected —
        approval decisions only ever happen through the dedicated Approve/Reject flow.
      parameters:
      - description: Work Order ID
        in: path
        name: id
        required: true
        type: integer
      - description: Work Order data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CreateWorkOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: แก้ไขหนังสือสั่งจ้าง (header + line items ทั้งใบ, เฉพาะสถานะ DRAFT)
      tags:
      - WorkOrder
  /work-order/{id}/lines:
    put:
      consumes:
      - application/json
      parameters:
      - description: Work Order ID
        in: path
        name: id
        required: true
        type: integer
      - description: Line items
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.UpdateWorkOrderLinesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: แทนที่รายการ line item (cost code) ทั้งหมดของหนังสือสั่งจ้าง
      tags:
      - WorkOrder
  /work-order/{id}/submit:
    post:
      description: |-
        Opens the step-1 approval_request if doc_type='WO' step 1 is configured in
        approval_config; otherwise the status change happens with no approval request
        (mirrors MemoHandler.Submit's hasConfig guard). Actual approve/reject happens via
        PUT /approval/WO/{id}/approve|reject (GenericApprovalHandler), not here.
      parameters:
      - description: Work Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: ยื่นขออนุมัติหนังสือสั่งจ้าง (DRAFT/REJECTED → PENDING_APPROVAL)
      tags:
      - WorkOrder
securityDefinitions:
  BearerAuth:
    description: Type "Bearer {token}"
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
