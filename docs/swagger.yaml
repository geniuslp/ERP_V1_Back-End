  /master/customer/import:
    post:
      consumes:
      - application/json
      description: 'Body {rows:[{row?, customer_code*, customer_name*, contact, contact_phone,
        tax_id, address, credit_term, remarks}]}, max 2000 rows, fully empty rows
        ignored. row (optional) is the spreadsheet row number used in error messages;
        default is the 1-based array position. Values are trimmed and empty optional
        fields become NULL. All rows are validated first (code required/max 20, name
        required/max 255, contact_phone max 50, tax_id (spaces/dashes stripped, must
        be 13 digits, raw max 20), credit_term free text max 50 (trimmed, empty =
        NULL, never parsed); duplicate customer_code inside the file, compared by
        lower(trim), is rejected and every involved row is listed); any error gives
        400 {errors:[{row,field,message}]} with Thai messages "แถวที่ N: ..." and
        nothing is written. Otherwise ONE transaction: match an existing customer
        by lower(trim(customer_code)); no match then INSERT (is_active=true, created_by);
        match then UPDATE all imported fields (a blank optional cell clears the stored
        value; is_active is never touched). Response data: {inserted, updated, total}
        (created = inserted, kept for older clients).'
      parameters:
      - description: rows
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.customerImportRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Import ลูกค้าจาก JSON (frontend อ่านไฟล์ Excel แล้วส่งเป็น rows)
      tags:
      - Customer
