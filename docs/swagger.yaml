          going forward
        type: integer
      customer_name:
        description: joined from customer.customer_name via customer_id
        type: string
      dept_code:
        description: '"แผนก" — FK -> departments.dept_code'
        type: string
      dept_name:
        description: joined from departments.dept_name via dept_code
        type: string
      end_date:
        type: string
      id:
        type: integer
      in_use:
        description: project_code already referenced by any work document (owner is
          then locked)
        type: boolean
      in_use_by:
        description: Thai doc-type names behind in_use; [] when unused
        items:
          type: string
        type: array
      is_active:
        type: boolean
      job_codes:
        items:
          type: string
        type: array
      job_shares:
        items:
          $ref: '#/definitions/handlers.ProjectJobShare'
        type: array
      location_code:
        description: free-text project address — no longer an FK/lookup against location.location_code
        type: string
      owner_id:
        description: 'deprecated: superseded by responsible_person_name (kept, unused
          by new UI — not dropped, same approach as credit)'
        type: integer
      owner_name:
        description: joined from users.full_name via owner_id ("ผู้รับผิดชอบหลัก"
          — legacy)
        type: string
      paid_amount:
        type: number
      project_code:
        type: string
      project_kind:
        description: NEW | VO — decides which of budget_amount / vo_amount applies
        type: string
      project_name:
        type: string
      project_owner_name:
        description: free text ("เจ้าของโครงการ") — legacy, kept for backward compat
          with existing records
        type: string
      remaining_amount:
        type: number
      responsible_person_name:
        description: free text ("ผู้รับผิดชอบหลัก"), required on write — replaces
          the owner_id dropdown
        type: string
      responsible_usernames:
        description: usernames joined by ", " (list + detail)
        type: string
      responsible_users:
        description: detail/create/update only; username only
        items:
          $ref: '#/definitions/models.ProjectResponsibleUser'
        type: array
      spent_amount:
        type: number
      start_date:
        type: string
      status:
        type: string
      updated_at:
        type: string
      updated_by:
        type: integer
      vo_amount:
        description: '"มูลค่า VO" — separate from budget_amount, never summed with
          it'
        type: number
    type: object
  handlers.ProjectJobShare:
