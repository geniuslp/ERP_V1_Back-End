        write anything. Each row''s mat_code is checked against material_code, joined
        out to mat_group/subgroup/mat_name/spec_size/brand/unit (LEFT JOIN — any link
        can be null). The file''s DESCRIPTION text is compared (whitespace-normalized,
        case-insensitive) against "mat_name + spec_description" from the master. Per
        row: code_found, master (object with mat_code/group_name/subgroup_name/mat_name/spec_description/brand_name/unit_name,
        or null if code_found is false), name_matched, and a derived status ("ok"|"code_not_found"|"name_mismatch").
        Response also includes a summary count of ok/code_not_found/name_mismatch.'
      parameters:
      - description: Excel file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Preview Stock Item import (ตรวจสอบ mat_code + รายละเอียดสินค้าเต็มรูปแบบ
        กับ material_code master ก่อนบันทึกจริง)
