  /finance/payments/{doc_type}/{doc_id}/installments:
    get:
      description: |-
        Rows ordered by installment_no, plus the document net_amount and the sum of installment
        amounts. The "installment mode on" state on the screen is simply: rows exist.
      parameters:
      - description: PO, WO or PC
