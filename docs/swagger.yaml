      summary: List all receive documents for a PO (one PO can now have many), plus
        create-eligibility
      tags:
      - IC
  /ic/pos/{poId}/receive-documents/{docId}:
    delete:
      description: Allowed only when receive_no IS NULL and it has no linked ic_project_cost_item_transaction
