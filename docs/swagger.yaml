  /ic/projects/{projectCode}/job-codes:
    get:
      description: Reads project.job_codes (text[]) for this project_code and resolves
        each against the fixed JobTypes list (internal/handlers/job_type.go) — NOT
        the unrelated cost_job master table, which uses a different single-letter
        code space (P/E/S/F/G/H/B) scoped per cost subject and shares the "job_code"
