  /pr/{id}/reopen:
    put:
      description: |-
        Only allowed when status='COMPLETED'. Blocks with 400 if any PO derived from this
        PR's lines (via purchase_order_line.pr_line_id) is not yet CANCELLED — the system
        does not auto-cancel anything; the user must cancel the referencing PO(s) manually
        first. Reverses any stock
        deducted by deductStockOnSubmit (stock_transaction rows with ref_doc_type='PR',
        ref_doc_id=id, txn_type='ISSUE') by restoring stock_item.qty and recording an
        offsetting RETURN transaction, then sets status back to DRAFT. Relies on the
        confirmed rule that a PR never has duplicate mat_code across its own lines, so
        reversing by ref_doc_id=pr_id alone (without a pr_line_id column on
        stock_transaction) is unambiguous.
      parameters:
      - description: PR ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Reopen a COMPLETED PR back to DRAFT for editing
      tags:
      - Purchase Request
  /pr/{id}/submit:
    post:
      parameters:
      - description: PR ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Submit PR (no approval required — goes straight to COMPLETED)
      tags:
      - Purchase Request
