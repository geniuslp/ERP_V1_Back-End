  /ic/projects/{projectCode}/movements/{id}/lines:
    get:
      description: Joins back to material_code/cost_subgroup hierarchy (source and
        target) and project for display, same field shape as available-materials/cost-codes
        plus to_project_name.
      parameters:
      - description: movement's own project.project_code
        in: path
        name: projectCode
        required: true
        type: string
      - description: ic_project_movement.id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: List line items for an IC Project Movement (detail page table)
      tags:
      - IC Project Movement
    post:
      consumes:
      - application/json
      description: |-
        Validates qty against ic_project_receipt_pool remaining = qty_received - qty_issued (locked FOR UPDATE) for (project_code, mat_code, cost_subgroup_id) and rejects with 400 if insufficient. For doc_type='ISSUE' the destination is forced to (movement.project_code, the line's own cost_subgroup_id) and any to_project_code/to_cost_subgroup_id in the body is ignored; for 'TRANSFER' both are required. Only DRAFT movements accept new lines. Does NOT deduct qty_on_hand here — deduction happens only when the whole movement document is confirmed/submitted (a separate, not-yet-built step). Inserts with the next line_no for this movement.
        Head cost codes (cost_subgroup.is_head) are rejected with 400 "Cost Code นี้เป็น Head ไม่สามารถเลือกใช้ได้ …" when the value is NEW or CHANGED vs what the document already stores.
      parameters:
      - description: movement's own project.project_code
        in: path
        name: projectCode
        required: true
        type: string
      - description: ic_project_movement.id
        in: path
        name: id
        required: true
        type: integer
      - description: Line item
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CreateIcProjectMovementLineRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Add a line item to an IC Project Movement (staged, not yet deducted)
      tags:
      - IC Project Movement
  /ic/projects/{projectCode}/movements/{id}/submit:
    post:
      consumes:
      - application/json
      description: One all-or-nothing transaction. Locks every touched source ic_project_receipt_pool
        row and destination ic_project_cost_item row (each set deduped and sorted
        by id ascending, pools first then cost items, to avoid deadlocks with concurrent
        movements), re-validates remaining (qty_received - qty_issued) under lock,
        then for each line adds qty to the pool's qty_issued (logged as ISSUE_OUT
        / ref_type MOVEMENT in ic_project_receipt_pool_transaction) and credits the
        destination ic_project_cost_item (logged in ic_project_cost_item_transaction,
        ref_type MOVEMENT_ISSUE/MOVEMENT_TRANSFER). A missing destination ic_project_cost_item
        row is auto-created. Every line is posted, including ISSUE lines whose destination
        key equals the source key (source is the receipt pool, destination is the
        cost item — different tables). Insufficient source remaining aborts the whole
        submit with 400. Transitions ic_project_movement.status DRAFT -> POSTED; already-POSTED
        rejects with 400.
      parameters:
      - description: movement's own project.project_code
        in: path
        name: projectCode
        required: true
        type: string
      - description: ic_project_movement.id
        in: path
        name: id
        required: true
        type: integer
      - description: optional {\
        in: body
        name: body
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Submit (confirm/post) an IC Project Movement
      tags:
      - IC Project Movement
  /ic/projects/{projectCode}/movements/available-materials:
    get:
      description: Same branching and response shape as GET .../movements/{id}/available-materials,
        but takes doc_type and job_code from the query instead of an existing movement.
        doc_type (ISSUE|TRANSFER) and job_code are both required; job_code must be
