        hierarchy for the job_code filter. Only rows with remaining (qty_received
        - qty_issued) > 0 are returned; the response's qty_on_hand field carries that
        computed remaining. job_code (e.g. "MP") is decomposed as cost_subject.subject_code=LEFT(job_code,1)
        + cost_job.job_code=SUBSTRING(job_code,2), the same convention pr_approval.go
        uses to resolve purchase_request.job_code — NOT a direct match against cost_job.job_code,
        which is a single-letter code in a different space (P/E/S/F/G/H/B) that never
        equals a 2-char JobTypes code on its own.
      parameters:
      - description: movement's own project.project_code
        in: path
        name: projectCode
        required: true
        type: string
      - description: ic_project_movement.id (unused for filtering here, kept for route
          symmetry)
        in: path
        name: id
        required: true
        type: integer
      - description: optional job_code filter (e.g. MP)
        in: query
        name: job_code
        type: string
      - description: cost_subgroup.id filter
        in: query
        name: subgroup_id
        type: integer
      - description: mat_name.id filter
        in: query
        name: mat_name_id
        type: integer
      - description: search mat_code / mat_name / spec
        in: query
        name: q
        type: string
