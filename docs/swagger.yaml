  /po/line-items:
    get:
      description: |-
        Cross-PO report — every PO with status=APPROVED (approval status only; status_receive is
        not considered), one object per PO with a nested "lines" array. mat_code filter is applied
        at the line level: only lines matching the filter appear in "lines", and a PO is dropped
        from the result entirely if none of its lines match. Pagination (page/page_size)
        paginates POs, not lines.
      parameters:
      - description: po_date >= (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: po_date <= (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      - description: po_no ILIKE filter
        in: query
        name: po_no
        type: string
      - description: mat_code ILIKE filter — only matching lines are kept, POs with
          no match are excluded
        in: query
        name: mat_code
        type: string
      - description: requested_by user id filter
        in: query
        name: requested_by
        type: integer
      - description: po.project_code filter
        in: query
        name: project_code
        type: string
      - default: 1
        description: page (paginates POs)
        in: query
        name: page
        type: integer
      - default: 20
        description: page_size (POs per page)
        in: query
        name: page_size
        type: integer
