  /ic/pos/{poId}/documents:
    get:
      description: 'Newest first (created_at DESC, then id DESC). doc_type RECEIVE|RETURN;
        id is ic_po_receive_document.id or ic_po_return_document.id; doc_no is receive_no
        (null for a receive document with no number yet, same as GET /ic/pos/{poId}/receive-documents)
        or return_no. line_count uses the same logic as the existing receive list
        (ledger rows linked by receive_document_id across ic_project_cost_item_transaction,
        ic_project_receipt_pool_transaction and stock_transaction) and return list
        (ic_po_return_line rows). total_qty: RECEIVE = SUM(qty) of those same linked
        ledger rows (stock and cost branches); RETURN = SUM(ic_po_return_line.return_qty).
        total_qty is null for a RECEIVE document that has no linked ledger rows (an
        empty draft, or legacy rows written before receive_document_id existed) —
        it cannot be derived reliably. RECEIVE only: tax_invoice_no, tax_invoice_date,
        temp_delivery_no, temp_delivery_date, due_date and the server-computed single
        reference ref_kind / ref_no / ref_date: ref_kind = TAX_INVOICE when tax_invoice_no
        is non-empty (after trim; primary when both exist), else TEMP_DELIVERY when
        temp_delivery_no is non-empty, else null; ref_no = the number of that kind;
        ref_date = the date of that kind, falling back to the other date when it is
        null (never invented; null when both are null or when ref_kind is null). RETURN
        only: return_date (ref_kind/ref_no/ref_date are null for returns). Fields
        that do not apply are null; every row has the same keys. 404 when the PO does
        not exist.'
      parameters:
      - description: purchase_order.id
        in: path
        name: poId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: List ALL documents of a PO — receives and returns merged
      tags:
      - IC
  /ic/pos/{poId}/header:
    get:
      description: pr_nos is the DISTINCT, ordered list of PR numbers linked to the
        PO through BOTH the header link (purchase_order.pr_id) and the line link (purchase_order_line.pr_line_id
        -> purchase_request_line -> purchase_request) — the same query GET /po uses
        for its pr_nos, so the two always agree. Never null (empty array when there
        is none). project_code and project_name are nullable. 404 when the PO does
        not exist.
      parameters:
