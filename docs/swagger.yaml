  /po/{id}/cancel:
    put:
      description: |-
        Cancels the PO and all of its lines (status='CANCELLED' on both), which frees
        up the source PR lines' qty_remaining for re-ordering — PRHandler.LinesWithPOStatus
        computes qty_ordered/qty_remaining live from purchase_order_line rows, filtering
        out ones with status='CANCELLED'. status_receive is left untouched: if goods were
        already received, that's a physical fact recorded in stock_inventory and is not
        erased by cancelling the PO — a cancelled PO can legitimately still show
        status_receive='PARTIALLY_RECEIVED'/'RECEIVED' as a historical record. Reversing
        physically-received stock is a separate stock-adjustment/return flow, not part of this endpoint.
      parameters:
      - description: PO ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Cancel an approved purchase order
      tags:
      - Purchase Order
  /po/{id}/edit-approved:
    put:
      consumes:
      - application/json
      description: 'Allows editing a PO with status=APPROVED or PENDING_REAPPROVAL,
        provided the PO''s created_at is less than 1 year old. Requires a mandatory
        non-empty reason, logged to po_edit_log. Replaces header fields and all lines,
        recomputes totals server-side, sets status to PENDING_REAPPROVAL, and reopens
        the PO''s existing approval_request row (same approval_id / assigned_to —
        not a fresh approver lookup). Idempotent while already PENDING_REAPPROVAL:
        repeated saves before the approver acts just keep re-editing and re-pending
        the same approval_request, so the frontend can call this endpoint for every
        save in this flow, not just the first.'
      parameters:
      - description: PO ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated PO data + reason
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.EditApprovedPORequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Edit an already-approved PO (requires reason, triggers re-approval)
      tags:
      - Purchase Order
