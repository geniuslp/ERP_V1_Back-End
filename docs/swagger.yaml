  /po/available-prs:
    get:
      description: Returns COMPLETED PRs that still have at least one line with remaining
        (qty_to_order - qty_ordered) > 0. A PR can appear here even if it already
        has an active PO — split ordering lets the same PR line be divided across
        multiple POs/suppliers as long as some quantity is left; see GET /po/pr-lines/{pr_id}
