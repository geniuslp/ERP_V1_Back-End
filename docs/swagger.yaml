        POST /pr/{id}/submit to re-run deductStockOnSubmit against the new
        qty_requested values and go back to COMPLETED.
      parameters:
      - description: PR ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated PR data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.UpdatePRRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Edit a DRAFT PR's header and lines
      tags:
      - Purchase Request
