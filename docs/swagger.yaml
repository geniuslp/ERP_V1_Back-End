  /ic/projects/{projectCode}/movements/submit:
    post:
      consumes:
      - application/json
      description: |-
        For when the document does not exist yet. ONE DB transaction: creates the header (same validation and doc_no generation as POST .../movements, status DRAFT), inserts the lines, then runs the exact same submit logic as POST .../movements/{id}/submit (lock, re-validate qty against on-hand/pool, deduct, credit, status POSTED). Any failure rolls back everything including the header — no orphan DRAFT. project_code in the header is taken from the path. Error codes (e.g. LINKED_WAREHOUSE_ISSUE_NOT_SUPPORTED, LINKED_TO_LINKED_TRANSFER_NOT_SUPPORTED) are identical to the id-based endpoints. lines is required and must be non-empty.
        Head cost codes (cost_subgroup.is_head) are rejected with 400 "Cost Code นี้เป็น Head ไม่สามารถเลือกใช้ได้ …" when the value is NEW or CHANGED vs what the document already stores.
      parameters:
      - description: movement's own project.project_code
        in: path
        name: projectCode
        required: true
        type: string
      - description: '{\'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Create + submit an IC Project Movement in one request (single-save
        flow)
      tags:
      - IC Project Movement
  /ic/projects/{projectCode}/stock:
