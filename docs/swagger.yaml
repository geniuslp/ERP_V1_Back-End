        increments purchase_request_line.qty_ordered and re-evaluates the parent PR
        status to PARTIALLY_FILLED or FULFILLED. Runs in one transaction with SELECT
        ... FOR UPDATE on the touched PR lines to prevent concurrent double-booking.
