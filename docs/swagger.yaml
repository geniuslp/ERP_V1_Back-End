  /work-order:
    get:
      parameters:
      - description: Status
        in: query
        name: status
        type: string
      - description: Project code
        in: query
        name: project_code
        type: string
      - description: Search by wo_no/supplier_name/employer_name
        in: query
        name: search
        type: string
      - description: Date from (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: Date to (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      - description: Page
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: รายการหนังสือสั่งจ้าง
      tags:
      - WorkOrder
    post:
      consumes:
      - application/json
      description: |-
        `lines` may be omitted or empty: the work order is created as DRAFT with all header totals 0.
        Each line that IS sent must have a non-empty cost_code. contract_amount must be > 0.
        At least one line is required later, at submit time.
      parameters:
      - description: Work Order data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CreateWorkOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: สร้างหนังสือสั่งจ้าง (DRAFT)
      tags:
      - WorkOrder
  /work-order/{id}:
    get:
      parameters:
      - description: Work Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: รายละเอียดหนังสือสั่งจ้าง
      tags:
      - WorkOrder
    put:
      consumes:
      - application/json
      description: |-
        Accepts the same body shape as Create (models.CreateWorkOrderRequest), mirroring
        POHandler.Update's all-in-one PUT. The `lines` key decides what happens to lines:
        OMITTED (or null) = existing lines are kept untouched and the header totals
        (total/discount/vat/wht/net) and their flags (use_discount, discount_type, use_vat,
        use_wht) are NOT recomputed — header fields are still updated; PRESENT, even as an
        empty array = existing lines are deleted and replaced by the sent ones and the totals
        are recomputed from them (an empty array leaves 0 lines and all-zero totals).
        Header fields that are omitted from the body are overwritten with blank/default
        values (not kept) — always send the full header. A transition to PENDING_APPROVAL
        requires at least one line (sent in this request, or already stored when `lines` is
        omitted) — otherwise 400 with a Thai message. The dedicated
        PUT /work-order/{id}/lines endpoint remains available for a lines-only edit that
        doesn't touch header fields. Only allowed while
        status = DRAFT — mirrors PO's Update rule exactly (PO also rejects everything
        else, including REJECTED, and points APPROVED callers at its edit-approved
        endpoint instead; WO has no such endpoint yet, so APPROVED/other statuses just 400).
        The payload's own `status` field ("บันทึกร่าง" sends DRAFT, "ส่งอนุมัติ" sends
        PENDING_APPROVAL) is written to the row and, when it actually changes, logged to
        work_order_status_log — a transition to PENDING_APPROVAL also opens the step-1
        approval_request exactly like POST /:id/submit does, since this is an alternate
        entry point into the same submit flow. Any other status value is rejected —
        approval decisions only ever happen through the dedicated Approve/Reject flow.
      parameters:
      - description: Work Order ID
        in: path
        name: id
        required: true
        type: integer
      - description: Work Order data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CreateWorkOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: แก้ไขหนังสือสั่งจ้าง (header + line items ทั้งใบ, เฉพาะสถานะ DRAFT)
      tags:
      - WorkOrder
  /work-order/{id}/edit-approved:
    put:
      consumes:
      - application/json
      description: |-
        Mirrors PO's PUT /po/{id}/edit-approved. Only allowed while status = APPROVED or
        PENDING_REAPPROVAL (400 otherwise). Body = the same shape as PUT /work-order/{id} plus a
        mandatory `reason` (plain Thai 400 when empty). In ONE transaction: header and lines are
        updated exactly like the normal edit (`lines` omitted = lines and totals kept; present = replaced
        and recomputed), status becomes PENDING_REAPPROVAL, a row is added to work_order_edit_log
        (this is what revision_round counts) and to work_order_status_log, and the document's existing
        approval_request is reopened (status PENDING) — same request, same assigned_to, so it goes
        back to the SAME approver. A sent approver_id and status are ignored. At least one line is
        required. wo_no never changes; the response/detail/list carry revision_round instead.
      parameters:
      - description: Work Order ID
        in: path
        name: id
        required: true
        type: integer
      - description: Work Order data + reason
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CreateWorkOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: แก้ไขหนังสือสั่งจ้างที่อนุมัติแล้ว (ต้องระบุเหตุผล, ส่งกลับอนุมัติใหม่)
      tags:
      - WorkOrder
  /work-order/{id}/lines:
    put:
      consumes:
      - application/json
      description: |-
        Replaces ALL lines of the work order (DELETE + INSERT) and recomputes the header totals
        (total/discount/vat/wht/net) and flags (use_discount, discount_type, use_vat, use_wht) from the
        new lines in the same transaction. Only allowed while status = DRAFT (400 otherwise, same message
        as PUT /work-order/{id}); 404 if the work order does not exist. At least 1 line is required
        here (an empty or omitted `lines` is a 400) — to clear all lines use PUT /work-order/{id}
        with `lines: []`.
      parameters:
      - description: Work Order ID
        in: path
        name: id
        required: true
        type: integer
      - description: Line items
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.UpdateWorkOrderLinesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: แทนที่รายการ line item (cost code) ทั้งหมดของหนังสือสั่งจ้าง (เฉพาะสถานะ
        DRAFT)
      tags:
      - WorkOrder
  /work-order/{id}/submit:
    post:
      description: |-
        Requires at least one line (400 with a Thai message otherwise). Opens the step-1 approval_request
        if doc_type='WO' step 1 is configured in
        approval_config; otherwise the status change happens with no approval request
        (mirrors MemoHandler.Submit's hasConfig guard). Actual approve/reject happens via
        PUT /approval/WO/{id}/approve|reject (GenericApprovalHandler), not here.
      parameters:
      - description: Work Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: ยื่นขออนุมัติหนังสือสั่งจ้าง (DRAFT/REJECTED → PENDING_APPROVAL)
      tags:
      - WorkOrder
  /work-order/{woId}/payment-conditions:
    get:
      description: 'Fetches all 3 payment-condition lists for this WO in one call:
        installments (work_order_payment_installment), retentions (work_order_retention),
        penalties (work_order_penalty).'
      parameters:
      - description: Work Order ID
        in: path
        name: woId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: ดึงเงื่อนไขการชำระเงินของหนังสือสั่งจ้าง (งวดชำระ/เงินประกันผลงาน/ค่าปรับ)
      tags:
      - WorkOrder
    post:
      consumes:
      - application/json
      description: 'Full replace-sync for all 3 tables in one transaction: rows with
        an id are updated, rows without one are inserted, and any existing row for
        this wo_id not present in the submitted array is deleted. No cross-row validation
        (e.g. percentages summing to 100) is applied — only what''s listed here. installments.payment_status
        must be UNPAID or PAID; switching to PAID without paid_date auto-fills it
        to today, switching back to UNPAID clears paid_date.'
      parameters:
      - description: Work Order ID
        in: path
        name: woId
        required: true
        type: integer
      - description: Full desired state of installments/retentions/penalties
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.UpdateWorkOrderPaymentConditionsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: บันทึกเงื่อนไขการชำระเงินของหนังสือสั่งจ้าง (แทนที่ทั้งหมดทั้ง 3 รายการ)
      tags:
      - WorkOrder
  /work-order/reserve-number:
    get:
      description: Calls nextval('wo_seq') and formats it immediately as the real
        wo_no (WO-<YYYY>-NNNNNN). Unlike the old MAX(id)+1 generation, this actually
        consumes the sequence right away — the number is reserved even if the create
        is never submitted (a gap is expected and fine). The frontend calls this once
        when the create-WO page opens, then submits the returned wo_no as part of
        POST /work-order.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Reserve the next Work Order number (consumes wo_seq)
      tags:
      - WorkOrder
  /work-order/wht-defaults:
    get:
      description: 'Single source of truth for the allowed contract_type values and
        the DEFAULT wht_rate per type (LABOR_MATERIAL 3, LABOR_ONLY 3, RENTAL 5, SERVICE
        3). Defaults only: saved lines keep their own wht_rate and stored amounts
        are never recomputed. allowed_rates are the per-line wht_rate values accepted
        (1, 3, 5).'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Contract types and their default withholding-tax rate
      tags:
      - WorkOrder
securityDefinitions:
  BearerAuth:
    description: Type "Bearer {token}"
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
