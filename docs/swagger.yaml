    get:
      description: data.source = WAREHOUSE -> stock_item rows of the project's warehouse
        (COALESCE(linked_warehouse_code, warehouse_code)), never the whole table;
        data.source = PROJECT -> ic_project_cost_item rows of the project. The two
        systems are never combined. only_with_stock defaults to true (qty > 0); pass
        only_with_stock=false to include zero-qty rows. data.no_stock = true when
        the list is empty (frontend shows "ยังไม่มีสินค้าในคลังนี้"). job_code (e.g.
        MS) applies to PROJECT only. Newest updated_at first.
