      - IC Project Movement
    post:
      consumes:
      - application/json
      description: Validates doc_type and that job_code is assigned to this project
        (server-side re-check against project.job_codes), generates doc_no (IS-YYYYMM-NNNN
        for ISSUE, TF-YYYYMM-NNNN for TRANSFER, each prefix with its own monthly sequence
