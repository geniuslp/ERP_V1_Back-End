  description: ERP System API — PR/PO/Store Management with full Approval workflow
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: ERP API
  version: "2.0"
paths:
  /approval-config:
