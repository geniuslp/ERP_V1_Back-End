      description: |-
        Reads ic_project_cost_item (the destination-side balance table) for this project, joined to material_code for the display name (mat_name + spec_description, same pattern as available-materials) and to the 4-level cost code hierarchy. only_with_stock defaults to true (qty_on_hand > 0); pass only_with_stock=false to also see zero-balance rows. job_code (e.g. "MP") uses the same decomposition as available-materials (cost_subject.subject_code = first character, cost_job.job_code = the rest). search matches mat_code or the composed mat_name (case-insensitive). Note this is the cost-item balance only — received-but-not-yet-issued quantity lives in ic_project_receipt_pool and is not included here.
        Default ordering: most recently updated first (updated_at DESC, id DESC); for warehouse-linked projects, stock_item.updated_at DESC, id DESC.
      parameters:
