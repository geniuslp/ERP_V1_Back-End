  /ic/pos/{poId}/receive-documents/{docId}/lines:
    get:
      description: |-
        Each line also carries cost_group_name, cost_group_code and cost_subgroup_name (null when the line has no cost subgroup), alongside the unchanged 4-level cost_code.
        Returns only the lines posted under this one receive document — not all lines of the PO. Both order_type='cost' (ic_project_cost_item_transaction.receive_document_id) and order_type='stock' (stock_transaction.receive_document_id) now carry this FK and are scoped the same way, returning scoped_by_document=true. FALLBACK for stock-type only: rows written before this FK existed (or for a PO that historically had more than one document, since the backfill only linked POs with exactly one document) have receive_document_id IS NULL — if the scoped query returns nothing, this falls back to every 'IN' stock_transaction row for the whole PO that still has receive_document_id IS NULL, returning scoped_by_document=false with a warning field. This fallback path never mixes in rows that are already linked to a *different* document.
      parameters:
      - description: purchase_order.id
        in: path
