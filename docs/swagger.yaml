        (see projectUsageSources in project_usage.go). Computed for the whole page
        with one query.
      parameters:
      - description: search project_code / project_name
        in: query
        name: search
        type: string
      - description: filter status
        in: query
        name: status
        type: string
      - description: filter is_active (default true; pass empty string for all)
        in: query
        name: is_active
        type: string
      - description: page
        in: query
        name: page
        type: integer
