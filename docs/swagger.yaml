  /petty-cash:
    get:
      parameters:
      - description: filter by status
        in: query
        name: status
        type: string
      - description: 'filter: document has at least one line with this project'
        in: query
        name: project_code
        type: string
      - description: YYYY-MM-DD
        in: query
        name: date_from
        type: string
      - description: YYYY-MM-DD
        in: query
        name: date_to
        type: string
      - description: default 1
        in: query
        name: page
        type: integer
      - description: default 20
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PaginatedResponse'
      security:
      - BearerAuth: []
      summary: List petty cash requisitions
      tags:
      - Petty Cash
    post:
      consumes:
      - application/json
      description: status starts as DRAFT unless status=PENDING_APPROVAL is passed
        (requires approver_id, ≥1 line and remarks). A DRAFT may have zero lines.
        pc_no is generated server-side (PC-YYYYMM-NNNN); any client pc_no is ignored.
        A line with an empty project_code falls back to the header project_code; if
        both are empty the line is stored with project_code NULL (department-only).
        At least one of header project_code, header dept_code or a line project_code
        is required (400 otherwise). With status=PENDING_APPROVAL every line must
        carry a cost_subgroup_id that is a selectable ITEM (not Head/Major), else
        400 "บรรทัดที่ N ยังไม่ได้ระบุรหัสต้นทุน" / "บรรทัดที่ N ใช้รหัสต้นทุนที่เลือกไม่ได้
        (Head/Major)"; a DRAFT may be saved without a cost code.
      parameters:
      - description: Petty cash requisition data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CreatePettyCashRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Create a petty cash requisition
      tags:
      - Petty Cash
