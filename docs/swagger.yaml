            $ref: '#/definitions/fiber.Map'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Rate the supplier on one specific receive document (quality/quantity/ontime,
        1-5)
      tags:
      - IC
  /ic/pos/{poId}/receive-lines:
    get:
      description: |-
        Each line also carries cost_group_name, cost_group_code and cost_subgroup_name (null when the line has no cost_subgroup_id), alongside the unchanged 4-level cost_code.
        Returns po_context (order_type, project_code), lines, and distinct mat_code/cost_code filter options for this PO's lines. receive_document_id is required and validated to belong to this PO — the remaining-balance figures (qty_received, bal_receive) are still computed cumulatively across ALL of the PO's receive documents (they read purchase_order_line.qty_received, a single PO-line-level running total), not scoped to just this one document.
      parameters:
      - description: purchase_order.id
        in: path
        name: poId
        required: true
        type: integer
      - description: ic_po_receive_document.id (optional; if given must belong to
          this PO)
        in: query
        name: receive_document_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: List PO line items for the receiving ("รายการสินค้า") tab
      tags:
      - IC
  /ic/pos/{poId}/receive-lines/submit:
    post:
      consumes:
      - application/json
      description: 'If the document is created inline from `header` (no receive_document_id),
        header.tax_invoice_date and header.temp_delivery_date follow the same rules
        as POST /receive-document: not later than today in Asia/Bangkok, else 400
        before anything is written or numbered. One DB transaction. receive_document_id
        is required. The target document is locked FOR UPDATE first, before anything
        else — a document accepts exactly ONE successful submit: if it already has
        a receive_no, this 409s with "this receive document has already been received
        — create a new receive document" rather than accepting more lines against
        it. Then locks the PO and each touched purchase_order_line (SELECT ... FOR
        UPDATE), requires purchase_order.status = ''APPROVED'' (400 otherwise), validates
        receive_qty against the line''s remaining balance (computed from purchase_order_line.qty_received,
        a running total across ALL of the PO''s receive documents — so total received
        can never exceed qty ordered no matter how many documents are used), then
        posts to stock_item/stock_transaction (order_type=''stock'', tagging each
        stock_transaction row with this receive_document_id) or ic_project_receipt_pool/ic_project_receipt_pool_transaction
        (order_type=''cost'', RECEIVE row tagged with this receive_document_id; ic_project_cost_item
        is only credited later by a movement ISSUE/TRANSFER), and recomputes purchase_order.status_receive.
        On success, issues receive_no (por_number_counter, monthly reset) for this
        document — generated exactly once, at this its one allowed submit.'
      parameters:
      - description: purchase_order.id
        in: path
        name: poId
        required: true
        type: integer
      - description: receive_document_id + lines to receive (only receive_qty > 0
          are processed)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.icSubmitReceiveLinesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Submit this round's PO line-item receiving (stock or cost destination)
      tags:
      - IC
  /ic/pos/{poId}/return-lines:
    get:
      description: |-
        Each line also carries cost_group_name, cost_group_code and cost_subgroup_name (null when the line has no cost_subgroup_id).
        Same shape as receive-lines, but for return: qty_received is the current cumulative received qty, which is the max returnable amount for the line. Requires purchase_order.status = 'APPROVED' (400 otherwise).
      parameters:
      - description: purchase_order.id
        in: path
        name: poId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: List PO line items for the return ("คืนสินค้า") tab
      tags:
      - IC
    post:
      consumes:
      - application/json
      description: 'One DB transaction. Locks the PO and each touched purchase_order_line
        (SELECT ... FOR UPDATE), requires purchase_order.status = ''APPROVED'' (400
        otherwise), validates return_qty against the line''s current qty_received,
        then subtracts from stock_item/stock_transaction (order_type=''stock'') or,
        for order_type=''cost'', first from the ic_project_receipt_pool available
        balance (qty_received - qty_issued; RETURN row) and any remainder from ic_project_cost_item
        (ref_type PO row), 400 with both available quantities if the total is short,
        and recomputes purchase_order.status_receive. Does not touch receive_no. Also
        creates one ic_po_return_document (RT-YYYYMM-NNNN from its own monthly ret_number_counter;
        optional return_date, default today Bangkok; optional remarks) plus its ic_po_return_line
        rows in the same transaction, and links the stock_transaction / ic_project_cost_item_transaction
        rows to it via return_document_id (pool RETURN rows carry no link column -
        derive them from ic_po_return_line). A duplicate line_id in one request is
        rejected. Response: return_id, return_no, doc_type="RETURN" (plus the reloaded
        lines).'
      parameters:
      - description: purchase_order.id
        in: path
        name: poId
        required: true
        type: integer
      - description: Lines to return (only return_qty > 0 are processed)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.icSubmitReturnLinesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Submit this round's PO line-item return (stock or cost source)
      tags:
      - IC
  /ic/pos/{poId}/return-lines/submit:
    post:
      consumes:
      - application/json
      description: 'One DB transaction. Locks the PO and each touched purchase_order_line
        (SELECT ... FOR UPDATE), requires purchase_order.status = ''APPROVED'' (400
        otherwise), validates return_qty against the line''s current qty_received,
