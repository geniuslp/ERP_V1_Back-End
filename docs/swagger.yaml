  /po/{projectCode}/cost-budget-detail:
    get:
      description: |-
        Flat ordered list with row_type MAJOR | HEAD | ITEM. ITEM rows (NOT is_head AND NOT is_major) are the
        subgroups that have a PO line in the project (POs not DRAFT/REJECTED/CANCELLED/deleted; order_type is NOT
        filtered), a project_cost_budget row, OR an APPROVED petty cash line charged to that cost code. budget comes from
        project_cost_budget (LEFT JOIN, no row => 0). po_cost = SUM(qty_ordered * unit_price); pc_cost = SUM(amount -
        line_discount) of APPROVED petty cash lines (header status APPROVED, the LINE's project_code = this project) —
        EX-VAT/ex-WHT, unlike spent_amount in GET /master/projects which is line_net (VAT-inclusive). pu_cost = po_cost + pc_cost.
        ac_cost is still a 0 placeholder. HEAD = sum of its group's ITEM rows, MAJOR = sum of all ITEM rows of its job
        (computed in the backend; a roll-up row appears only when it has at least one ITEM under it). Order per job: MAJOR,
        then each group's HEAD followed by its ITEMs. APPROVED petty cash lines with no cost code are summed into one last
        synthetic ITEM row (is_unassigned=true, subgroup_id null, description "ไม่ระบุรหัสต้นทุน", only when the amount is not 0);
        it has no Head/Major roll-up and no budget. totals (budget, po_cost, pc_cost, pu_cost, ...) = sum of all ITEM rows
        including the unassigned row, so pc_cost reconciles with the project-level petty cash total (ex-VAT).
      parameters:
      - description: Project code
        in: path
        name: projectCode
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Cost Budget modal — project header + per-cost-code rows
      tags:
      - Purchase Order
  /po/{projectCode}/cost-budget-detail/{subgroupId}/purchases:
    get:
      description: PO lines (with optional PR number) for one project + cost_subgroup,
        same status filters as the detail endpoint.
      parameters:
      - description: Project code
        in: path
        name: projectCode
        required: true
        type: string
      - description: cost_subgroup.id
        in: path
        name: subgroupId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Cost Budget modal — purchase lines behind one cost code
      tags:
      - Purchase Order
  /po/available-prs:
    get:
      description: Each row also carries project_code and project_name (LEFT JOIN
        project; null when the PR has no project). Returns COMPLETED and PARTIALLY_FILLED
        PRs that still have at least one line with remaining (qty_requested - qty_reserved
        - qty_ordered) > 0 — same rule as GET /po/pr-lines/{pr_id}. A PR can appear
        here even if it already has an active PO — split ordering lets the same PR
        line be divided across multiple POs/suppliers as long as some quantity is
        left; see GET /po/pr-lines/{pr_id} for the per-line remaining breakdown.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: List PRs eligible to be linked to a new PO
      tags:
      - Purchase Order
  /po/cost-budget:
    get:
      description: |-
        One row per cost_code with at least one purchase_order_line under an APPROVED PO
        in the given project. pu_cost sums purchase_order_line.amount grouped by
        cost_subgroup_id. ac_cost allocates each PO's payment_log.amount_paid across its
        lines by each line's share of the PO's net_amount (line.amount / po.net_amount),
        then sums those allocated amounts per cost_subgroup_id. budget is hardcoded to 0 —
        no budget-setting system exists yet — so pu_bal/ac_bal are always <= 0 for now.
        cost_code and cost_subgroup_name follow the same join chain as po.go's Get handler
        and project_overview.go (cost_subgroup -> cost_group -> cost_job -> cost_subject).
        Lines with no cost_subgroup_id assigned are excluded — there's no cost_code to
        group them under.
      parameters:
      - description: Project code
        in: query
        name: project_code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Cost Budget page — Level 2 cost-code breakdown for a project
      tags:
      - Purchase Order
  /po/cost-budget/{projectCode}/cost-codes/{costSubgroupId}/po-lines:
    get:
      description: |-
        Rows behind the Pu.Cost figure of one ITEM row of GET /po/{projectCode}/cost-budget-detail. Filtered by ids only (project_code + cost_subgroup_id, never the displayed cost code) with EXACTLY the Pu rule: po.deleted_at IS NULL, po.status NOT IN (DRAFT, REJECTED, CANCELLED), line status <> CANCELLED. So SUM(amount) = the row's pu_cost. quantity = qty_ordered; amount = qty_ordered * unit_price (reference only). item_name = material name + spec, falling back to the line description (same as the purchases drill-down). unit = material_code unit. Ordered by po_no, line_no; not paginated (one cost code in one project). 404 when the cost code is not an ITEM of this project's budget page (no budget row, no PO line and no APPROVED petty cash line).
        Every row has source: "PO" (the rows above) or "PC" — APPROVED petty cash lines (header status APPROVED, the LINE's project_code = this project, cost_subgroup_id = this cost code) mapped as: po_id = petty cash header id, po_no = petty cash document number (PC-YYYYMM-NNNN), po_status = petty cash status, item_name = line description else material name + spec, quantity = line qty, amount = amount - line_discount (EX-VAT/ex-WHT; spent_amount in GET /master/projects uses line_net, VAT-inclusive). The PC amounts sum to the row's pc_cost on cost-budget-detail; PO amounts stay qty_ordered * unit_price as before. costSubgroupId may be the literal "none": returns only the PC rows of the project with no cost code (the unassigned row), 404 if there are none. Order: PO rows first, then PC, each by document number, line_no.
      parameters:
      - description: Project code
        in: path
        name: projectCode
        required: true
        type: string
      - description: cost_subgroup.id, or none for petty cash lines without a cost
          code
        in: path
        name: costSubgroupId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Cost Budget — PO and petty cash lines charged to one cost code of a
        project
      tags:
      - Purchase Order
  /po/export:
    get:
      description: |-
        Same filters as GET /po/line-items (date_from, date_to, po_no, requested_by, project_code,
        receiving_status, dept_code, search) but returns every matching PO, without pagination and
        without nested lines. total_amount is pre-VAT after discount (purchase_order.total_amount -
        discount_amount). credit is credit days parsed from supplier.payment_terms, or the raw text
        when it cannot be parsed. dept_code = department of the requester (falls back to the linked PR).
      parameters:
      - description: po_date >= (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: po_date <= (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      - description: po_no ILIKE filter
        in: query
        name: po_no
        type: string
      - description: requested_by user id filter
        in: query
        name: requested_by
        type: integer
      - description: po.project_code filter
        in: query
        name: project_code
        type: string
      - description: NOT_RECEIVED | PARTIAL | COMPLETE
        in: query
        name: receiving_status
        type: string
      - description: 'department of the requester (fallback: linked PR dept_code)'
        in: query
        name: dept_code
        type: string
      - description: matches po_no or any linked pr_no (ILIKE)
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Export approved POs (one row per PO, no pagination)
      tags:
      - Purchase Order
  /po/line-items:
    get:
      description: |-
        Cross-PO report — every PO with status=APPROVED (approval status only; status_receive is
        not considered), one object per PO with a nested "lines" array. mat_code filter is applied
        at the line level: only lines matching the filter appear in "lines", and a PO is dropped
        from the result entirely if none of its lines match. Pagination (page/page_size)
        paginates POs, not lines.
        Each line also carries cost_subgroup_id, cost_code, cost_name, head_subgroup_id,
        head_cost_code, head_cost_name (the Head of the line's cost group; the line's own
        subgroup when it is itself the Head; null when the group has no Head), qty_received
        (purchase_order_line.qty_received, already net of IC returns), qty_outstanding
        (>= 0, 0 for a cancelled line) and line_receiving_status (NOT_RECEIVED | PARTIAL |
        COMPLETE; null for a cancelled line). Each PO carries receiving_status derived from its
        non-cancelled lines (null when none).
      parameters:
      - description: po_date >= (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: po_date <= (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      - description: po_no ILIKE filter
        in: query
        name: po_no
        type: string
      - description: mat_code ILIKE filter — only matching lines are kept, POs with
          no match are excluded
        in: query
        name: mat_code
        type: string
      - description: requested_by user id filter
        in: query
        name: requested_by
        type: integer
      - description: po.project_code filter
        in: query
        name: project_code
        type: string
      - description: 'header receiving status: NOT_RECEIVED | PARTIAL | COMPLETE (derived
          from non-cancelled lines, same rule as Finance)'
        in: query
        name: receiving_status
        type: string
      - description: PO matches when at least one line has exactly this cost_subgroup_id
        in: query
        name: cost_subgroup_id
        type: integer
      - description: id of a Head subgroup; PO matches when at least one line's cost
          subgroup is in that Head's group
        in: query
        name: head_subgroup_id
        type: integer
      - description: 'department of the requester (fallback: linked PR dept_code when
          requested_by is NULL)'
        in: query
        name: dept_code
        type: string
      - description: matches po_no or any linked pr_no (ILIKE)
        in: query
        name: search
        type: string
      - default: 1
        description: page (paginates POs)
        in: query
        name: page
        type: integer
      - default: 20
        description: page_size (POs per page)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PaginatedResponse'
      security:
      - BearerAuth: []
      summary: List approved POs with their line items (grouped by PO)
      tags:
      - Purchase Order
  /po/list-export:
    get:
      description: |-
        Same filters and same row fields as GET /po (status, order_type, my, date_from, date_to, dept_code,
        search), but returns every matching PO in one response. Intended for client-side .xlsx export.
      parameters:
      - description: status filter — comma-separated for multiple
        in: query
        name: status
        type: string
      - description: when true, only POs created by the current user
        in: query
        name: my
        type: boolean
      - description: stock | cost | asset_machine | asset_office_equipment | asset_tools
        in: query
        name: order_type
        type: string
      - description: po_date >= (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: po_date <= (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      - description: 'requester''s department (fallback: linked PR dept_code)'
        in: query
        name: dept_code
        type: string
      - description: UNPAID | PARTIAL | PAID (computed from payment_log vs net_amount)
        in: query
        name: payment_status
        type: string
      - description: matches po_no or any linked pr_no (ILIKE)
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Export purchase orders (no pagination, no implicit status filter)
      tags:
      - Purchase Order
  /po/pr-lines/{pr_id}:
    get:
      description: Feeds the "pull lines from PR" picker on the PO-create page. Returns
        only lines with remaining = qty_requested - qty_reserved - qty_ordered > 0;
        fully ordered lines are NOT returned. qty_ordered is the accumulated qty across
        all non-cancelled POs (cancelling/deleting a PO gives its qty back, so the
        line reappears). Does not read qty_to_order — POST /po validation (reconcilePRLineQty)
        and the PR status recompute use the same remaining expression. Returns 400
        if the PR is CANCELLED and 404 if it does not exist.
      parameters:
      - description: PR ID
        in: path
        name: pr_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: List a PR's lines that can still be ordered
      tags:
      - Purchase Order
  /po/receivable:
    get:
      description: 'Returns approved POs that have not been fully received yet: status=APPROVED,
        status_receive IN (NOT_SENT, SENT, PARTIALLY_RECEIVED), and at least one line
        still OPEN or PARTIAL.'
      parameters:
      - description: search by po_no
        in: query
        name: search
        type: string
      - default: 1
        description: page
        in: query
        name: page
        type: integer
      - default: 20
        description: page_size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PaginatedResponse'
      security:
      - BearerAuth: []
      summary: List POs that are eligible for goods receiving (GRN)
      tags:
      - Purchase Order
  /po/search:
    get:
      description: Matches POs with status=APPROVED and status_receive IN (NOT_SENT,
        SENT, PARTIALLY_RECEIVED).
      parameters:
      - description: PO number keyword (partial match)
        in: query
        name: po_no
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Search receivable Purchase Orders by partial po_no match
      tags:
      - GoodsReceipt
  /pr:
    get:
      description: |-
        available_for_po=true additionally restricts to COMPLETED / PARTIALLY_FILLED PRs that
        have at least one line with qty_requested - qty_reserved - qty_ordered > 0 — for the "select
        PR to create PO from" picker only. Omit it for any other PR listing (PR status/
        history pages), which must keep showing every PR regardless of reference status.
        Each item also carries po_conversion_status, computed from purchase_request_line
        qty_requested vs qty_ordered (aggregated across all lines, not the same as "status"):
        FULLY_CONVERTED (every line qty_ordered >= qty_requested), PARTIALLY_CONVERTED
        (at least one line qty_ordered > 0 but not all lines fully ordered), NOT_CONVERTED
        (every line qty_ordered = 0 or NULL).
        Each item also carries job_name (resolved from job_code via cost_subject+cost_job,
        same join as GET /pr/{id}) and project_name (resolved from project_code via the
        project table) — both null when the PR has no job_code/project_code or the code
        doesn't resolve to a live master row.
        Each item also carries memo_no (resolved from memo_id via the memo table),
        dept_name (resolved from dept_code via the departments table), required_date
        ("วันที่ส่งสินค้า" — when the requester needs the goods by, distinct from pr_date)
        and created_at ("วันที่เปิดเอกสาร" — the DB row insert timestamp). dept_name,
        memo_no, and required_date are null when the PR has no dept_code/memo_id/
        required_date or the code doesn't resolve to a live row.
        Each item also carries has_remaining (bool) — true if any line has
        qty_requested - qty_reserved - qty_ordered > 0 (same expression as the PO-create pickers).
        linked_pos: [{po_id, po_no, status}] — every non-CANCELLED PO with a line referencing this PR (distinct, by po_no, [] when none).
        Each item also carries has_active_po_link (bool) — true if any of this PR's
        lines are referenced by a purchase_order_line belonging to a non-CANCELLED PO.
        Same condition the PR detail page's blocking-PO warning banner and the Update
        handler's edit guard use — the frontend should hide/disable "แก้ไข" when true.
      parameters:
      - description: status filter — one of DRAFT, COMPLETED, STOCK_CHECK, PARTIALLY_FILLED,
          FULFILLED, CANCELLED
        in: query
        name: status
        type: string
      - description: true = only COMPLETED/PARTIALLY_FILLED PRs with qty_requested
          - qty_reserved - qty_ordered > 0 on at least one line
        in: query
        name: available_for_po
        type: boolean
      - description: matches pr_no or remarks (ILIKE, substring)
        in: query
        name: search
        type: string
      - description: filter by created_at >= this date (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: filter by created_at <= this date (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      - description: exact match on pr.job_code
        in: query
        name: job_code
        type: string
      - description: stock | cost | asset_machine | asset_office_equipment | asset_tools
        in: query
        name: order_type
        type: string
      - default: 1
        description: page
        in: query
        name: page
        type: integer
      - default: 20
        description: limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: List purchase requests
      tags:
      - Purchase Request
    post:
      consumes:
      - application/json
      description: |-
        job_code is required — one of the 12 fixed job type codes (MP, ME, MS, MF, MG, MH, FS, FP, FB, DE, RE, G).
        lines[].deduct_stock (optional, default true): whether Submit should reserve this line against stock_item.qty. false skips deduction entirely — the whole qty routes to qty_to_order for PO.
        Head cost codes (cost_subgroup.is_head) are rejected with 400 "Cost Code นี้เป็น Head ไม่สามารถเลือกใช้ได้ …" when the value is NEW or CHANGED vs what the document already stores.
        pr_no is generated server-side at save time (pr_number_counter, inside the create transaction); any pr_no in the body is ignored. Response data: {"id": <int>, "pr_no": "PRYYYYMM-NNNN"}.
      parameters:
      - description: PR data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CreatePRRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Create purchase request
      tags:
      - Purchase Request
  /pr/{id}:
    delete:
      description: Only allowed while status=DRAFT and no non-CANCELLED, non-deleted
        PO line references any of its lines. Sets deleted_at/deleted_by — never deletes
        rows, never changes status. A DRAFT PR has no stock reservation (that only
        happens in Submit's deductStockOnSubmit), so there is nothing to roll back
        here.
      parameters:
      - description: PR ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Soft-delete a PR
      tags:
      - Purchase Request
    get:
      description: |-
        po_conversion_status is computed from purchase_request_line qty_requested vs
        qty_ordered aggregated across all lines: FULLY_CONVERTED, PARTIALLY_CONVERTED,
        or NOT_CONVERTED (same 3 values as GET /pr's list-level field).
        project_name is resolved from project_code via the project table (null if the
        PR has no project_code or it doesn't match a live project row), same as job_name.
        dept_name is resolved from dept_code via the departments table, and memo_no is
        resolved from memo_id via the memo table — both null when the PR has no
        dept_code/memo_id or the code doesn't resolve to a live row. Also carries
        required_date and created_at. Every line carries deduct_stock (bool, stored per line). linked_pos: [{po_id, po_no, status}] of every non-CANCELLED PO
        that has a line referencing this PR (distinct, ordered by po_no; [] when none).
      parameters:
      - description: PR ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Get PR detail with lines and attachments
      tags:
      - Purchase Request
    put:
      consumes:
      - application/json
      description: |-
        Allowed from DRAFT, COMPLETED, STOCK_CHECK, PARTIALLY_FILLED, FULFILLED; CANCELLED -> 400.
        Returns 409 (plain Thai message) if any line is referenced by an active PO (status != CANCELLED),
        before any write. A non-DRAFT PR is first brought back to DRAFT exactly like PUT /pr/{id}/reopen
        (stock/project-credit reversal, which itself returns 409 if the project already consumed the
        material), then lines are saved: a line sent with its id is updated IN PLACE (cost_subgroup_id, qty, ...
        persist on the existing row; mat_code of an existing line cannot change -> 400), a line without id is inserted,
        and existing lines missing from the payload are deleted (409 if the line ever credited a project's stock).
        The stock/project-credit reversal always uses the cost code stored before the edit; the re-submit reserves under the new one.
        status=COMPLETED in the body re-submits in the same tx. Cost code may be blank on DRAFT, required on COMPLETED.
        job_code: omit to keep the PR's current value; job_code must be one of the 12 fixed job type codes if sent.
        lines[].deduct_stock (optional, default true): whether Submit should reserve this line against stock_item.qty.
        Head cost codes (cost_subgroup.is_head) are rejected with 400 "Cost Code นี้เป็น Head ไม่สามารถเลือกใช้ได้ …" when the value is NEW or CHANGED vs what the document already stores.
      parameters:
      - description: PR ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated PR data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.UpdatePRRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
        "409":
          description: active PO linked to this PR, or stock already consumed
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Edit a PR's header and lines (any status except CANCELLED, never while
        a PO is linked)
      tags:
      - Purchase Request
  /pr/{id}/attachments:
    get:
      parameters:
      - description: PR ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.PRAttachment'
            type: array
