        type: boolean
      - description: drop warehouse projects
        in: query
        name: exclude_warehouse
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Project dropdown options (unpaginated)
      tags:
      - Master
