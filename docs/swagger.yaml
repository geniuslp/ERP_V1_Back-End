  /master/projects/options:
    get:
      description: 'Every matching project in one response for form selectors (Memo,
        PR, PO, WO, Petty Cash) — GET /master/projects is paginated (max page_size
        100, default 20) and cuts the list off. Ordered by project_code. Default =
        status ACTIVE and is_active = true; include_closed adds status CLOSED, include_inactive
        adds status INACTIVE and is_active = false. search matches project_code or
