      - description: 'true = approval-page scope for the JWT user: memos assigned
          to them (approver_id), legacy NULL-approver memos they can approve by role
          (approval_config), and memos they already approved/rejected'
        in: query
        name: my_approvals
        type: string
      - description: true = (PR memo panel) hide memos with no available line left;
