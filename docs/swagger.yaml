        Code นี้เป็น Head ไม่สามารถเลือกใช้ได้ …" when the value is NEW or CHANGED
        vs what the document already stores.
      parameters:
      - description: Petty cash requisition ID
        in: path
        name: id
        required: true
        type: integer
      - description: Petty cash requisition data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.UpdatePettyCashRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Update a petty cash requisition (only while DRAFT or REJECTED)
      tags:
      - Petty Cash
