host: localhost:8080
info:
  contact:
    email: support@erp.local
    name: ERP Support
  description: ERP System API — PR/PO/Store Management with full Approval workflow
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: ERP API
  version: "2.0"
paths:
  /approval-config:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: List approval configs
      tags:
      - Approval Config
  /approval-config/{id}:
    delete:
      parameters:
      - description: ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: Delete approval config
      tags:
      - Approval Config
    patch:
      consumes:
      - application/json
      parameters:
      - description: ID
        in: path
        name: id
        required: true
        type: integer
      - description: is_active
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: Toggle approval config active status
      tags:
      - Approval Config
  /approval-config/batch:
    post:
      consumes:
      - application/json
      parameters:
      - description: create array and delete id array
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: Batch create/delete approval config steps
      tags:
      - Approval Config
  /approval-delegation:
    get:
      parameters:
      - description: Filter by doc type
        in: query
        name: doc_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: List extra approvers
      tags:
      - Approval Delegation
    post:
      consumes:
      - application/json
      parameters:
      - description: Extra approver payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.approvalDelegationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: Add an extra approver (additive, on top of role-based approvers)
      tags:
      - Approval Delegation
  /approval-delegation/{id}:
    delete:
      parameters:
      - description: Extra approver row ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: Remove an extra approver
      tags:
      - Approval Delegation
  /approval-doc-types:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: List approval document types
      tags:
      - Approval Doc Types
    post:
      consumes:
      - application/json
      parameters:
      - description: doc_type, doc_label, is_active
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: Create approval document type
      tags:
      - Approval Doc Types
  /approval-doc-types/{id}:
    patch:
      consumes:
      - application/json
      parameters:
      - description: ID
        in: path
        name: id
        required: true
        type: integer
      - description: is_active
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: Toggle approval document type active status
      tags:
      - Approval Doc Types
  /approval-request/{docType}/{docId}/my-status:
    get:
      description: |-
        Backs Approve/Reject button gating on the frontend. Eligibility = role-based approver
        (approval_config + user_roles) OR extra approver (approval_delegation), for the doc's
        current PENDING approval_request row.
      parameters:
      - description: Document type, e.g. MEMO, BORROW, or PO
        in: path
        name: docType
        required: true
        type: string
      - description: Document ID
        in: path
        name: docId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Check whether the current user is an eligible approver for a document's
        current step
      tags:
      - Approvals
  /approval/{docType}/{docId}/approve:
    put:
      consumes:
      - application/json
      parameters:
      - description: Document type, e.g. PO or MEMO
        in: path
        name: docType
        required: true
        type: string
      - description: Document ID
        in: path
        name: docId
        required: true
        type: integer
      - description: Optional comments
        in: body
        name: body
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Approve a document (generic, config-driven)
      tags:
      - Approvals
  /approval/{docType}/{docId}/reject:
    put:
      consumes:
      - application/json
      parameters:
      - description: Document type, e.g. PO or MEMO
        in: path
        name: docType
        required: true
        type: string
      - description: Document ID
        in: path
        name: docId
        required: true
        type: integer
      - description: Optional comments
        in: body
        name: body
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Reject a document (generic, config-driven)
      tags:
      - Approvals
  /approvals/audit:
    get:
      parameters:
      - description: table name filter
        in: query
        name: table_name
        type: string
      - description: record ID
        in: query
        name: record_id
        type: integer
      - default: 1
        description: page
        in: query
        name: page
        type: integer
      - default: 20
        description: page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PaginatedResponse'
      security:
      - BearerAuth: []
      summary: Get general ERP audit log
      tags:
      - Approvals
  /approvals/logs:
    get:
      parameters:
      - description: PR|PO|GRN
        in: query
        name: doc_type
        required: true
        type: string
      - description: document ID
        in: query
        name: doc_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.ApprovalLog'
            type: array
      security:
      - BearerAuth: []
      summary: Get approval history for a document
      tags:
      - Approvals
  /approvals/pending:
    get:
      parameters:
      - description: filter by doc_type (PR|PO|GRN)
        in: query
        name: doc_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.ApprovalRequest'
            type: array
      security:
      - BearerAuth: []
      summary: List pending approvals for current user
      tags:
      - Approvals
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Change the current user's password
      parameters:
      - description: Passwords
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
