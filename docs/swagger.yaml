  /stock-transfer/{id}/confirm:
    post:
      description: |-
        One DB transaction. Locks each line's source stock_item row (SELECT ... FOR UPDATE),
        verifies sufficient qty, moves stock according to transfer_type (WH_TO_WH: deduct
        source warehouse item, credit destination warehouse item; WH_TO_PROJECT: deduct
        source warehouse item, credit project_stock; PROJECT_TO_WH: deduct project_stock,
        credit destination warehouse item), and records a stock_transaction per line
        (ref_doc_type=STOCK_TRANSFER) for the shared movement history.
      parameters:
      - description: Transfer ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: ยืนยันรับของ / ยืนยันการย้ายคลัง (DRAFT → CONFIRMED)
      tags:
      - StockTransfer
  /stock-transfer/history:
    get:
      description: |-
        Reads stock_transaction WHERE ref_doc_type IN ('STOCK_TRANSFER','REQUISITION'),
        joined to stock_item for mat_code/name and to warehouse/project for from/to display
        names (a location can be either, so both are LEFT JOINed and whichever matches is used).
      parameters:
      - description: 'Filter: STOCK_TRANSFER or REQUISITION'
        in: query
        name: ref_doc_type
        type: string
      - description: Material code
        in: query
        name: mat_code
        type: string
      - description: Date from (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: Date to (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      - description: Page
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: ประวัติการเคลื่อนไหว (Requisition + Stock Transfer รวมกัน)
