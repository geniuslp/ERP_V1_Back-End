        GET /master/eligible-approvers?doc_type=PR (400 otherwise). The PR becomes
        PENDING_APPROVAL and an approval_request is opened; stock is NOT reserved
        yet — that happens when the approver approves (PUT /approval/PR/{id}/approve
        -> COMPLETED, see PostApprove). Every line must have a cost_subgroup_id, otherwise
        400 "กรุณาระบุ Cost Code ให้ครบทุกรายการก่อนส่ง (บรรทัดที่ N, ...)". DRAFT
        saves are not affected. The same rule applies to POST /pr and PUT /pr/{id}
        when status is a submit status.'
