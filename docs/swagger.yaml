        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Update project
      tags:
      - Master
  /master/projects/import:
    post:
      consumes:
      - multipart/form-data
      description: 'Sheet 1, row 1 = header; columns are found by HEADER TEXT (case/space/underscore-insensitive),
        so the order does not matter and unknown/legacy columns are ignored: project_name*
        , customer_code* , "Project location_code", start_date, end_date, budget_amount,
        "job Code". A project_code / consultant_name / consultant_phone / responsible_person_name
        column in an old file is ignored and never written — project_code is always
        generated exactly like POST /master/projects ({year}-{customer_code}-{NNN}
        from project_code_year_counter, Asia/Bangkok year). TWO PASSES, ALL-OR-NOTHING:
        pass 1 validates every row without writing or allocating any number (customer_code
        is normalised — spaces/NBSP removed, case-insensitive — and resolved with
        ONE query; it must exist and be active; the project code uses the customer''s
        STORED code; job Code is FREE TEXT with no validation: comma-separated, each
        value trimmed/upper-cased, empty values dropped, duplicates removed (order
        kept), stored as job_codes ("xx, mp ,ME" -> {XX,MP,ME}); an empty cell gives
        empty job_codes; project_name required; start_date/end_date: real Excel date
        cells (1900 or 1904 system, no day shift) or year-first text 2026-01-01 /
        2026/01/01 (one-digit month/day ok, spaces/NBSP trimmed); ambiguous forms
        (01/02/2026), years < 1900 or > 2400 are rejected with "แถว N: วันที่เริ่มต้น|วันที่สิ้นสุดไม่ถูกต้อง
        (ใช้รูปแบบ 2026-01-01 หรือ 2026/01/01)"; empty = no date; there is no end
        >= start rule; budget_amount numeric >= 0). Any error -> HTTP 400, nothing
        created, counter untouched, body {success:false, error:"<first messages>",
        data:{imported:0, failed:N, errors:[{row, reason:"แถว N: …"}]}} listing ALL
        row errors. Pass 2 runs one transaction that allocates the numbers and inserts
        every row (rollback gives the numbers back). job_codes = the parsed list;
        job_shares are never written. Success: 200 {success:true, count:N, data:{imported,
        rows:[{row,id,project_code}], errors:[]}}.'
      parameters:
      - description: Excel file (.xlsx)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Bulk import projects from Excel
      tags:
      - Master
  /master/projects/import/template:
    get:
      description: 'Generated on the fly. Sheet "Project", row 1 = header: project_name,
        customer_code, "Project location_code", start_date, end_date, budget_amount,
        "job Code" (project_code, consultant_name, consultant_phone and responsible_person_name
        were removed — the code is generated on import). Two sample rows use real
        customer_code values from the customer table (first two active customers),
        job codes "MP,ME" and "MS". The "job Code" column is free text: no dropdown/data
        validation and no Lookup sheet (the template has the single sheet "Project");
        a header comment says multiple codes are typed comma-separated.'
      produces:
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        "200":
          description: OK
          schema:
            type: file
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Download the Excel template for project import
      tags:
      - Master
  /master/projects/next-code:
    get:
      description: 'Never reserves or writes anything: next_no = project_code_year_counter.last_no
        (0 if none) + 1 for the current Asia/Bangkok year; the running number is shared
        by ALL customers and customer_id only supplies the customer_code part. Create
        still allocates the real code atomically, so the final code can differ if
        someone else creates a project first.'
