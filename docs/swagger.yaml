  /ic/pos/{poId}/receive-documents/{docId}/rating:
    put:
      consumes:
      - application/json
      description: 'Same validation and 1-5 scoring rules as the legacy GRN Score
        endpoint (POST /grn/{id}/score): all three scores required, each 1-5, score_notes
        optional. Requires the specific docId to exist for this PO (404) and to have
        a receive_no already issued (400 — line items must be submitted via receive-lines/submit
        before rating, same as Tab 1 must precede Tab 2). Unlike GRN (which blocks
        re-scoring once POSTED), this endpoint rejects a second rating attempt on
        the same document with 409 rather than allowing overwrite. Sets rated_at=NOW()
        and rated_by=claims.UserID in one transaction. A PO can now have many receive
        documents — this endpoint rates exactly the document named by docId, not "the
        PO" as a whole (superseded the old PO-scoped PUT /ic/pos/{poId}/receive-document/rating,
        which has been removed — nothing in this repo called it).'
      parameters:
      - description: purchase_order.id
        in: path
        name: poId
        required: true
        type: integer
      - description: ic_po_receive_document.id
        in: path
        name: docId
        required: true
